<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#090d16" stroke="url(#goldGrad)" stroke-width="4" />
  
  <!-- Gourmet Fork Graphic -->
  <g filter="url(#glow)">
    <!-- Chef Hat Base -->
    <path d="M36 32 C 34 22, 44 18, 50 24 C 56 18, 66 22, 64 32 Z" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Fork Tines -->
    <path d="M38 38 L38 52 M46 38 L46 54 M54 38 L54 54 M62 38 L62 52" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Fork Base Bridge -->
    <path d="M38 52 C38 62, 62 62, 62 52" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Fork Handle -->
    <path d="M50 60 L50 82" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Handle Accent Ring -->
    <circle cx="50" cy="82" r="3" fill="url(#goldGrad)" />
  </g>
</svg>
